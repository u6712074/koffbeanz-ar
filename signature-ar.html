<style>

}

}

#instruction {

  position: fixed;

  bottom: 22px;

  width: 92%;

  max-width: 460px;

  text-align: center;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 13px;

  line-height: 1.45;

  background: rgba(0,0,0,0.60);

  padding: 11px 15px;

<script>


/* ================================================= */
/* ELEMENTS */
/* ================================================= */

const rotationHolder =
  document.querySelector("#rotationHolder");

const moveHolder =
  document.querySelector("#moveHolder");


/* ================================================= */
/* ROTATION */
/* ================================================= */

let rotationY = 0;

let startX = 0;

let startRotationY = 0;


/* ================================================= */
/* MOVEMENT */
/* ================================================= */

let startCenterX = 0;

let startCenterY = 0;

let startMoveX = 0;

let startMoveZ = 0;


/* ================================================= */
/* ZOOM */
/* ================================================= */

let startDistance = 0;

let startScale = 0.55;


/* ================================================= */
/* TWO-FINGER MODE */
/* ================================================= */

let twoFingerMode = false;


/* ================================================= */
/* TOUCH START */
/* ================================================= */

document.addEventListener(

  "touchstart",

  function(event) {


    /* ============================================= */
    /* ONE FINGER = ROTATION */
    /* ============================================= */

    if (event.touches.length === 1) {


      twoFingerMode = false;


      startX =
        event.touches[0].clientX;


      startRotationY =
        rotationY;

    }


    /* ============================================= */
    /* TWO FINGERS = MOVE / ZOOM */
    /* ============================================= */

    if (event.touches.length === 2) {


      twoFingerMode = true;


      const x1 =
        event.touches[0].clientX;

      const y1 =
        event.touches[0].clientY;


      const x2 =
        event.touches[1].clientX;

      const y2 =
        event.touches[1].clientY;


      /* ----------------------------------------- */
      /* CENTER */
      /* ----------------------------------------- */

      startCenterX =
        (x1 + x2) / 2;


      startCenterY =
        (y1 + y2) / 2;


      /* ----------------------------------------- */
      /* DISTANCE */
      /* ----------------------------------------- */

      const dx =
        x1 - x2;

      const dy =
        y1 - y2;


      startDistance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /* ----------------------------------------- */
      /* CURRENT POSITION */
      /* ----------------------------------------- */

      const position =
        moveHolder.getAttribute("position");


      startMoveX =
        position.x;

      startMoveZ =
        position.z;


      /* ----------------------------------------- */
      /* CURRENT SCALE */
      /* ----------------------------------------- */

      const scale =
        rotationHolder.getAttribute("scale");


      startScale =
        scale.x;

    }

  },

  { passive: false }

);


/* ================================================= */
/* TOUCH MOVE */
/* ================================================= */

document.addEventListener(

  "touchmove",

  function(event) {


    event.preventDefault();


    /* ============================================= */
    /* ONE FINGER = HORIZONTAL ROTATION ONLY */
    /* ============================================= */

    if (

      event.touches.length === 1 &&
      !twoFingerMode

    ) {


      const currentX =
        event.touches[0].clientX;


      const deltaX =
        currentX - startX;


      /*
       * ONLY horizontal movement
       * affects rotation.
       *
       * Vertical movement is completely
       * ignored.
       */

      rotationY =
        startRotationY +
        deltaX * 0.55;


      rotationHolder.setAttribute(

        "rotation",

        {
          x: 0,
          y: rotationY,
          z: 0
        }

      );

    }


    /* ============================================= */
    /* TWO FINGERS */
    /* ============================================= */

    if (event.touches.length === 2) {


      const x1 =
        event.touches[0].clientX;

      const y1 =
        event.touches[0].clientY;


      const x2 =
        event.touches[1].clientX;

      const y2 =
        event.touches[1].clientY;


      /* ========================================= */
      /* CENTER MOVEMENT */
      /* ========================================= */

      const currentCenterX =
        (x1 + x2) / 2;


      const currentCenterY =
        (y1 + y2) / 2;


      const deltaCenterX =
        currentCenterX -
        startCenterX;


      const deltaCenterY =
        currentCenterY -
        startCenterY;


      /*
       * Move the whole product.
       */

      const newMoveX =
        startMoveX +
        deltaCenterX * 0.002;


      const newMoveZ =
        startMoveZ -
        deltaCenterY * 0.002;


      moveHolder.setAttribute(

        "position",

        {
          x: newMoveX,
          y: 0,
          z: newMoveZ
        }

      );


      /* ========================================= */
      /* PINCH ZOOM */
      /* ========================================= */

      const dx =
        x1 - x2;


      const dy =
        y1 - y2;


      const currentDistance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const distanceChange =
        currentDistance -
        startDistance;


      let newScale =
        startScale +
        distanceChange * 0.0015;


      /* Minimum */

      if (newScale < 0.35) {

        newScale = 0.35;

      }


      /* Maximum */

      if (newScale > 0.85) {

        newScale = 0.85;

      }


      rotationHolder.setAttribute(

        "scale",

        {
          x: newScale,
          y: newScale,
          z: newScale
        }

      );

    }

  },

  { passive: false }

);


/* ================================================= */
/* TOUCH END */
/* ================================================= */

document.addEventListener(

  "touchend",

  function(event) {


    /*
     * If fingers are released,
     * remember the current rotation.
     */

    const currentRotation =
      rotationHolder.getAttribute("rotation");


    rotationY =
      currentRotation.y;


    /*
     * Remember the current position.
     */

    const currentPosition =
      moveHolder.getAttribute("position");


    startMoveX =
      currentPosition.x;

    startMoveZ =
      currentPosition.z;


    /*
     * Reset mode.
     */

    if (event.touches.length === 0) {

      twoFingerMode = false;

    }

  }

);


</script>
