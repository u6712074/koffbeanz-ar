<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KOFFBEANZ - Signature Blend AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 5px black;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="info">
    ☕ KOFFBEANZ — SIGNATURE BLEND
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;">

    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/pattern-AR%20Signature%20Blend.patt">

      <!-- YOUR ACTUAL PRODUCT IMAGE -->
      <a-image
        src="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/signature-blend.png"
        position="0 0.8 0"
        width="1.5"
        height="1.5"
        rotation="-90 0 0"
        animation="property: position; to: 0 0.95 0; dir: alternate; loop: true; dur: 1500">
      </a-image>

      <!-- PRODUCT NAME -->
      <a-text
        value="SIGNATURE BLEND"
        position="0 1.7 0"
        align="center"
        color="white"
        width="4">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
