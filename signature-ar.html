<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>KOFFBEANZ — Signature Blend AR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;
    }

    /* TOP TITLE */

    #title {

      position: fixed;

      top: 18px;

      left: 0;

      width: 100%;

      text-align: center;

      font-family: Arial, sans-serif;

      font-size: 19px;

      font-weight: bold;

      color: white;

      text-shadow:
        0 2px 5px black,
        0 0 8px black;

      z-index: 100;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <!-- ============================================ -->
  <!-- SCREEN TITLE -->
  <!-- ============================================ -->

  <div id="title">

    ☕ KOFFBEANZ — SIGNATURE BLEND

  </div>



  <!-- ============================================ -->
  <!-- AR SCENE -->
  <!-- ============================================ -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "

  >



    <!-- ========================================== -->
    <!-- SIGNATURE BLEND MARKER -->
    <!-- ========================================== -->

    <a-marker

      type="pattern"

      url="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/pattern-AR%20Signature%20Blend.patt"

      smooth="true"

      smoothCount="10"

      smoothTolerance="0.01"

      smoothThreshold="5"

    >



      <!-- ======================================== -->
      <!-- ENTIRE PRODUCT GROUP -->
      <!-- ======================================== -->

      <a-entity

        position="0 0 0"

        scale="0.55 0.55 0.55"

      >



        <!-- ====================================== -->
        <!-- MAIN COFFEE BAG BODY -->
        <!-- ====================================== -->

        <a-box

          position="0 0.95 0"

          width="1.35"

          height="1.75"

          depth="0.38"

          material="
            color: #3B241A;
            roughness: 0.75;
            metalness: 0;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- FRONT PRODUCT ARTWORK -->
        <!-- ====================================== -->

        <a-plane

          position="0 0.95 0.201"

          width="1.22"

          height="1.55"

          material="
            src: url(https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/signature-blend.png);
            transparent: true;
            side: double;
          "

        >
        </a-plane>



        <!-- ====================================== -->
        <!-- LEFT SIDE -->
        <!-- ====================================== -->

        <a-box

          position="-0.69 0.95 0"

          width="0.10"

          height="1.75"

          depth="0.42"

          material="
            color: #291810;
            roughness: 0.85;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- RIGHT SIDE -->
        <!-- ====================================== -->

        <a-box

          position="0.69 0.95 0"

          width="0.10"

          height="1.75"

          depth="0.42"

          material="
            color: #291810;
            roughness: 0.85;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- TOP SEALED FOLD -->
        <!-- ====================================== -->

        <a-box

          position="0 1.88 0"

          width="1.42"

          height="0.18"

          depth="0.42"

          material="
            color: #24140E;
            roughness: 0.80;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- TOP FOLD DETAIL -->
        <!-- ====================================== -->

        <a-box

          position="0 1.81 0.22"

          width="1.15"

          height="0.025"

          depth="0.025"

          material="
            color: #8C684F;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- BOTTOM BASE -->
        <!-- ====================================== -->

        <a-box

          position="0 0.05 0"

          width="1.42"

          height="0.12"

          depth="0.42"

          material="
            color: #28170F;
            roughness: 0.85;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- LEFT FRONT FOLD -->
        <!-- ====================================== -->

        <a-box

          position="-0.47 0.95 0.215"

          width="0.025"

          height="1.45"

          depth="0.015"

          material="
            color: #FFFFFF;
            opacity: 0.10;
            transparent: true;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- RIGHT FRONT FOLD -->
        <!-- ====================================== -->

        <a-box

          position="0.43 0.95 0.215"

          width="0.025"

          height="1.35"

          depth="0.015"

          material="
            color: #FFFFFF;
            opacity: 0.08;
            transparent: true;
          "

        >
        </a-box>



        <!-- ====================================== -->
        <!-- PRODUCT NAME -->
        <!-- ====================================== -->

        <a-text

          value="SIGNATURE BLEND"

          position="0 2.25 0"

          align="center"

          color="#FFFFFF"

          width="3.8"

          side="double"

        >
        </a-text>



        <!-- ====================================== -->
        <!-- TAGLINE -->
        <!-- ====================================== -->

        <a-text

          value="BREW YOUR MOOD"

          position="0 2.02 0"

          align="center"

          color="#D6B89A"

          width="2.4"

          side="double"

        >
        </a-text>



      </a-entity>



    </a-marker>



    <!-- ========================================== -->
    <!-- LIGHTING -->
    <!-- ========================================== -->

    <a-light

      type="ambient"

      intensity="1.2"

    >
    </a-light>



    <a-light

      type="directional"

      intensity="1.3"

      position="2 4 3"

    >
    </a-light>



    <!-- ========================================== -->
    <!-- CAMERA -->
    <!-- ========================================== -->

    <a-entity camera></a-entity>



  </a-scene>


</body>

</html>
