<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>KOFFBEANZ - Signature Blend AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #title {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;

      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;

      color: white;
      text-shadow: 0 2px 6px black;

      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>


<body>

  <!-- Screen title -->
  <div id="title">
    ☕ KOFFBEANZ — SIGNATURE BLEND
  </div>


  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >


    <!-- ================================================= -->
    <!-- SIGNATURE BLEND MARKER                            -->
    <!-- ================================================= -->

    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/pattern-AR%20Signature%20Blend.patt"
    >


      <!-- ================================================= -->
      <!-- MAIN 3D COFFEE POUCH                              -->
      <!-- ================================================= -->

      <a-entity
        position="0 0 0"
        animation="
          property: position;
          from: 0 0 0;
          to: 0 0.08 0;
          dir: alternate;
          loop: true;
          dur: 1800;
          easing: easeInOutSine;
        "
      >


        <!-- =============================================== -->
        <!-- COFFEE BAG BODY                                 -->
        <!-- =============================================== -->

        <a-box
          position="0 0.95 0"
          width="1.35"
          height="1.75"
          depth="0.38"

          material="
            color: #3B241A;
            roughness: 0.65;
            metalness: 0;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- FRONT LABEL / ARTWORK                           -->
        <!-- =============================================== -->

        <a-plane
          position="0 0.95 0.201"
          width="1.22"
          height="1.55"

          material="
            src: url(https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/signature-blend.png);
            transparent: true;
            side: double;
          "
        >
        </a-plane>


        <!-- =============================================== -->
        <!-- LEFT SIDE — GIVES REAL 3D DEPTH                 -->
        <!-- =============================================== -->

        <a-box
          position="-0.69 0.95 0"
          width="0.10"
          height="1.75"
          depth="0.42"

          material="
            color: #291810;
            roughness: 0.8;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- RIGHT SIDE                                      -->
        <!-- =============================================== -->

        <a-box
          position="0.69 0.95 0"
          width="0.10"
          height="1.75"
          depth="0.42"

          material="
            color: #291810;
            roughness: 0.8;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- TOP SEALED FOLD                                 -->
        <!-- =============================================== -->

        <a-box
          position="0 1.88 0"
          width="1.42"
          height="0.18"
          depth="0.42"

          material="
            color: #24140E;
            roughness: 0.75;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- TOP FOLD LINE                                   -->
        <!-- =============================================== -->

        <a-box
          position="0 1.82 0.22"
          width="1.20"
          height="0.025"
          depth="0.025"

          material="
            color: #8C684F;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- BOTTOM BASE                                     -->
        <!-- =============================================== -->

        <a-box
          position="0 0.05 0"
          width="1.42"
          height="0.12"
          depth="0.42"

          material="
            color: #28170F;
            roughness: 0.8;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- SUBTLE FRONT "CRINKLE" DETAILS                  -->
        <!-- =============================================== -->

        <a-box
          position="-0.47 0.95 0.215"
          width="0.025"
          height="1.45"
          depth="0.015"

          material="
            color: #FFFFFF;
            opacity: 0.10;
            transparent: true;
          "
        >
        </a-box>


        <a-box
          position="0.43 0.95 0.215"
          width="0.025"
          height="1.35"
          depth="0.015"

          material="
            color: #FFFFFF;
            opacity: 0.08;
            transparent: true;
          "
        >
        </a-box>


        <!-- =============================================== -->
        <!-- FLOATING BRAND TEXT                             -->
        <!-- =============================================== -->

        <a-text
          value="SIGNATURE BLEND"

          position="0 2.25 0"

          align="center"

          color="#FFFFFF"

          width="3.8"

          side="double"
        >
        </a-text>


        <!-- =============================================== -->
        <!-- SMALL DESCRIPTION                               -->
        <!-- =============================================== -->

        <a-text
          value="BREW YOUR MOOD"

          position="0 2.02 0"

          align="center"

          color="#D6B89A"

          width="2.4"

          side="double"
        >
        </a-text>


        <!-- =============================================== -->
        <!-- DECORATIVE RING                                 -->
        <!-- =============================================== -->

        <a-ring
          position="0 0.02 0"

          rotation="-90 0 0"

          radius-inner="0.82"

          radius-outer="0.86"

          material="
            color: #C9A27E;
            opacity: 0.8;
            transparent: true;
          "

          animation="
            property: rotation;
            to: -90 360 0;
            loop: true;
            dur: 5000;
            easing: linear;
          "
        >
        </a-ring>


      </a-entity>


    </a-marker>


    <!-- ================================================= -->
    <!-- LIGHTING                                         -->
    <!-- ================================================= -->

    <a-light
      type="ambient"
      intensity="1.2"
    >
    </a-light>


    <a-light
      type="directional"
      intensity="1.5"
      position="2 4 3"
    >
    </a-light>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


</body>

</html>
