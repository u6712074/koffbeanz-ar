<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KOFFBEANZ AR Test</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 5px black;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="info">
    ☕ KOFFBEANZ AR TEST
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;">

    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/pattern-test-marker.patt">

      <a-box
        position="0 0.5 0"
        rotation="0 0 0"
        color="red"
        scale="1 1 1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>

      <a-text
        value="IT WORKS!"
        position="0 1.5 0"
        align="center"
        color="white"
        width="4">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
