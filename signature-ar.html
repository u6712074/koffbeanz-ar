<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>KOFFBEANZ — Signature Blend AR</title>


  <!-- ========================================= -->
  <!-- A-FRAME -->
  <!-- ========================================= -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


  <!-- ========================================= -->
  <!-- AR.JS -->
  <!-- ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      touch-action: none;

    }


    #title {

      position: fixed;

      top: 18px;

      left: 0;

      width: 100%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 19px;

      font-weight: bold;

      letter-spacing: 1px;

      color: white;

      text-shadow:
        0 2px 5px black,
        0 0 8px black;

      z-index: 100;

      pointer-events: none;

    }


    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform: translateX(-50%);

      width: 90%;

      max-width: 430px;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 14px;

      line-height: 1.4;

      color: white;

      background: rgba(0, 0, 0, 0.58);

      padding: 10px 16px;

      border-radius: 22px;

      z-index: 100;

      pointer-events: none;

      box-sizing: border-box;

    }

  </style>

</head>


<body>


  <!-- ========================================= -->
  <!-- TITLE -->
  <!-- ========================================= -->

  <div id="title">

    ☕ KOFFBEANZ — SIGNATURE BLEND

  </div>


  <!-- ========================================= -->
  <!-- INSTRUCTIONS -->
  <!-- ========================================= -->

  <div id="instruction">

    👆 Drag to rotate &nbsp; • &nbsp; 🤏 Pinch to zoom

  </div>



  <!-- ========================================= -->
  <!-- AR SCENE -->
  <!-- ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "

  >


    <!-- ======================================= -->
    <!-- SIGNATURE BLEND MARKER -->
    <!-- ======================================= -->

    <a-marker

      type="pattern"

      url="https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/pattern-AR%20Signature%20Blend.patt"

      smooth="true"

      smoothCount="10"

      smoothTolerance="0.01"

      smoothThreshold="5"

    >


      <!-- ===================================== -->
      <!-- AR ORIENTATION HOLDER -->
      <!-- DO NOT ROTATE THIS WITH FINGER -->
      <!-- ===================================== -->

      <a-entity

        id="arHolder"

        position="0 0 0"

        rotation="-90 0 0"

      >


        <!-- =================================== -->
        <!-- PRODUCT ROTATION HOLDER -->
        <!-- THIS IS THE ACTUAL PIVOT -->
        <!-- =================================== -->

        <a-entity

          id="product"

          position="0 0.95 0"

          rotation="0 0 0"

          scale="0.55 0.55 0.55"

        >


          <!-- ================================= -->
          <!-- MAIN COFFEE POUCH -->
          <!-- ================================= -->

          <a-box

            position="0 0 0"

            width="1.35"

            height="1.75"

            depth="0.38"

            material="
              color: #3B241A;
              roughness: 0.78;
              metalness: 0;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- FRONT SIGNATURE BLEND ARTWORK -->
          <!-- ================================= -->

          <a-plane

            position="0 0 0.201"

            rotation="0 0 0"

            width="1.22"

            height="1.55"

            material="
              src: url(https://raw.githubusercontent.com/u6712074/koffbeanz-ar/refs/heads/main/signature-blend.png);
              transparent: true;
              side: double;
            "

          >
          </a-plane>



          <!-- ================================= -->
          <!-- LEFT SIDE -->
          <!-- ================================= -->

          <a-box

            position="-0.69 0 0"

            width="0.10"

            height="1.75"

            depth="0.42"

            material="
              color: #28170F;
              roughness: 0.88;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- RIGHT SIDE -->
          <!-- ================================= -->

          <a-box

            position="0.69 0 0"

            width="0.10"

            height="1.75"

            depth="0.42"

            material="
              color: #28170F;
              roughness: 0.88;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- TOP SEAL -->
          <!-- ================================= -->

          <a-box

            position="0 0.93 0"

            width="1.42"

            height="0.18"

            depth="0.42"

            material="
              color: #24140E;
              roughness: 0.82;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- TOP SEAL HIGHLIGHT -->
          <!-- ================================= -->

          <a-box

            position="0 0.87 0.22"

            width="1.12"

            height="0.025"

            depth="0.025"

            material="
              color: #A77B59;
              roughness: 0.55;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- SECOND SEAL LINE -->
          <!-- ================================= -->

          <a-box

            position="0 0.82 0.22"

            width="0.95"

            height="0.018"

            depth="0.018"

            material="
              color: #684633;
              roughness: 0.65;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- BOTTOM BASE -->
          <!-- ================================= -->

          <a-box

            position="0 -0.90 0"

            width="1.42"

            height="0.12"

            depth="0.42"

            material="
              color: #26160F;
              roughness: 0.88;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- LEFT FRONT FOLD -->
          <!-- ================================= -->

          <a-box

            position="-0.47 0 0.215"

            width="0.025"

            height="1.45"

            depth="0.015"

            material="
              color: #FFFFFF;
              opacity: 0.09;
              transparent: true;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- RIGHT FRONT FOLD -->
          <!-- ================================= -->

          <a-box

            position="0.43 0 0.215"

            width="0.025"

            height="1.35"

            depth="0.015"

            material="
              color: #FFFFFF;
              opacity: 0.07;
              transparent: true;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- CENTER HIGHLIGHT -->
          <!-- ================================= -->

          <a-box

            position="0 0 0.215"

            width="0.018"

            height="1.20"

            depth="0.012"

            material="
              color: #FFFFFF;
              opacity: 0.045;
              transparent: true;
            "

          >
          </a-box>



          <!-- ================================= -->
          <!-- PRODUCT NAME -->
          <!-- ================================= -->

          <a-text

            value="SIGNATURE BLEND"

            position="0 1.30 0"

            align="center"

            color="#FFFFFF"

            width="3.6"

            side="double"

          >
          </a-text>



          <!-- ================================= -->
          <!-- TAGLINE -->
          <!-- ================================= -->

          <a-text

            value="BREW YOUR MOOD"

            position="0 1.09 0"

            align="center"

            color="#D6B89A"

            width="2.25"

            side="double"

          >
          </a-text>



          <!-- ================================= -->
          <!-- DESCRIPTION -->
          <!-- ================================= -->

          <a-text

            value="PREMIUM COFFEE BEANS"

            position="0 -1.08 0"

            align="center"

            color="#E5D2C0"

            width="1.8"

            side="double"

          >
          </a-text>



          <!-- ================================= -->
          <!-- DISPLAY PLATFORM -->
          <!-- ================================= -->

          <a-cylinder

            position="0 -0.97 0"

            radius="0.72"

            height="0.035"

            segments="48"

            material="
              color: #6B4937;
              roughness: 0.70;
              opacity: 0.85;
              transparent: true;
            "

          >
          </a-cylinder>



          <!-- ================================= -->
          <!-- DECORATIVE COFFEE BEANS -->
          <!-- ================================= -->

          <a-sphere

            position="-0.78 -0.87 0.15"

            radius="0.055"

            scale="1 0.55 0.35"

            material="
              color: #24140E;
              roughness: 0.80;
            "

          >
          </a-sphere>



          <a-sphere

            position="0.78 -0.87 0.12"

            radius="0.055"

            scale="1 0.55 0.35"

            material="
              color: #24140E;
              roughness: 0.80;
            "

          >
          </a-sphere>


        </a-entity>


      </a-entity>


    </a-marker>



    <!-- ========================================= -->
    <!-- LIGHTING -->
    <!-- ========================================= -->

    <a-light

      type="ambient"

      intensity="1.25"

    >
    </a-light>



    <a-light

      type="directional"

      intensity="1.35"

      position="2 4 3"

    >
    </a-light>



    <a-light

      type="point"

      intensity="0.5"

      position="-2 2 2"

    >
    </a-light>



    <!-- ========================================= -->
    <!-- CAMERA -->
    <!-- ========================================= -->

    <a-entity camera></a-entity>


  </a-scene>



  <!-- ========================================= -->
  <!-- TOUCH CONTROL -->
  <!-- ========================================= -->

  <script>


    const product =
      document.querySelector("#product");


    /* ========================================= */
    /* ROTATION */
    /* ========================================= */

    let rotationX = 0;

    let rotationY = 0;


    let startX = 0;

    let startY = 0;


    let startRotationX = 0;

    let startRotationY = 0;


    /* ========================================= */
    /* ZOOM */
    /* ========================================= */

    let startDistance = 0;

    let startScale = 0.55;



    /* ========================================= */
    /* TOUCH START */
    /* ========================================= */

    document.addEventListener(

      "touchstart",

      function(event) {


        /* ------------------------------------- */
        /* ONE FINGER */
        /* ------------------------------------- */

        if (event.touches.length === 1) {


          startX =
            event.touches[0].clientX;


          startY =
            event.touches[0].clientY;


          startRotationX =
            rotationX;


          startRotationY =
            rotationY;

        }



        /* ------------------------------------- */
        /* TWO FINGERS */
        /* ------------------------------------- */

        if (event.touches.length === 2) {


          const dx =
            event.touches[0].clientX -
            event.touches[1].clientX;


          const dy =
            event.touches[0].clientY -
            event.touches[1].clientY;


          startDistance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          const currentScale =
            product.getAttribute("scale");


          startScale =
            currentScale.x;

        }

      },

      { passive: false }

    );



    /* ========================================= */
    /* TOUCH MOVE */
    /* ========================================= */

    document.addEventListener(

      "touchmove",

      function(event) {


        event.preventDefault();



        /* ===================================== */
        /* ONE FINGER ROTATION */
        /* ===================================== */

        if (
          event.touches.length === 1
        ) {


          const currentX =
            event.touches[0].clientX;


          const currentY =
            event.touches[0].clientY;


          const deltaX =
            currentX - startX;


          const deltaY =
            currentY - startY;


          /*
           * Horizontal drag:
           * rotate around the pouch itself.
           */

          rotationY =
            startRotationY +
            deltaX * 0.55;


          /*
           * Vertical drag:
           * tilt around the pouch itself.
           */

          rotationX =
            startRotationX -
            deltaY * 0.28;


          /*
           * Prevent the pouch from
           * completely flipping over.
           */

          if (rotationX < -70) {

            rotationX = -70;

          }


          if (rotationX > 70) {

            rotationX = 70;

          }


          product.setAttribute(

            "rotation",

            {
              x: rotationX,
              y: rotationY,
              z: 0
            }

          );

        }



        /* ===================================== */
        /* TWO FINGER ZOOM */
        /* ===================================== */

        if (
          event.touches.length === 2
        ) {


          const dx =
            event.touches[0].clientX -
            event.touches[1].clientX;


          const dy =
            event.touches[0].clientY -
            event.touches[1].clientY;


          const currentDistance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          const difference =
            currentDistance -
            startDistance;


          let newScale =
            startScale +
            difference * 0.0015;


          /*
           * Minimum zoom
           */

          if (newScale < 0.35) {

            newScale = 0.35;

          }


          /*
           * Maximum zoom
           */

          if (newScale > 0.85) {

            newScale = 0.85;

          }


          product.setAttribute(

            "scale",

            {
              x: newScale,
              y: newScale,
              z: newScale
            }

          );

        }

      },

      { passive: false }

    );



    /* ========================================= */
    /* TOUCH END */
    /* ========================================= */

    document.addEventListener(

      "touchend",

      function() {


        const currentRotation =
          product.getAttribute("rotation");


        rotationX =
          currentRotation.x;


        rotationY =
          currentRotation.y;

      }

    );


  </script>


</body>

</html>
